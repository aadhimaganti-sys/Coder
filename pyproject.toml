[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ai"
version = "0.1.0"
description = "CPU-efficient PyTorch image classification for Raspberry Pi"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "Pillow>=9.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
